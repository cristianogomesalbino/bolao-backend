name: Tag Version

on:
  push:
    branches:
      - main

jobs:
  tag:
    name: Create version tag from merge
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the merge commit with the pull request text
        run: |
          set -euo pipefail

          subject="$(git log -1 --format=%s)"
          case "$subject" in
            "Merge pull request "*)
              ;;
            *)
              echo "Este push não é o merge de um pull request. Nenhuma tag criada."
              exit 0
              ;;
          esac

          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            echo "Este commit já tem tag."
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          latest="${latest#v}"
          if [ -z "$latest" ]; then
            latest="$(node -p "require('./package.json').version")"
          fi

          major="${latest%%.*}"
          rest="${latest#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          tag="v${major}.${minor}.$((patch + 1))"

          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Tag ${tag} já existe"
            exit 0
          fi

          git log -1 --format=%B > /tmp/mensagem-da-tag.txt
          git tag -a "$tag" -F /tmp/mensagem-da-tag.txt
          git push origin "$tag"
          echo "Tag ${tag} criada no merge, com o texto do pull request."
